[project]
name = "doujinshi-meta"
version = "0.3.0"
description = "CLI tool to crawl doujinshi metadata from Bika and JMComic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "jmcomic>=2.7.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
djm = "doujinshi_meta.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doujinshi_meta"]

[tool.hatch.build.targets.wheel.sources]
"src/doujinshi_meta" = "doujinshi_meta"

[dependency-groups]
dev = [
    "nuitka>=2.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: 需本地构建产物或真网环境",
]
addopts = "-m 'not integration'"
